<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Playground v2 — Scroll tuner</title>
    <link rel="stylesheet" href="../../split-text-playground/fonts.css" />
    <link rel="stylesheet" href="tuner.css" />
    <link rel="stylesheet" href="../playground-v2.css" />
  </head>
  <body>
    <main class="page playground-v2-canvas">
      <section class="frame frame--1" aria-label="Scroll spacer">
        <p class="frame__copy split-target">Scroll down to preview the animation on frame 2.</p>
      </section>
      <section class="frame frame--2" aria-label="Animation frame">
        <p class="frame__copy split-target" data-split>
          Line masks clip overflowing content so reveals feel like curtains rising on each row.
          Combine words and lines when you need per-line masking with word-level nuance inside
          long paragraphs.
        </p>
      </section>
      <section class="frame frame--3" aria-label="Scroll spacer">
        <p class="frame__copy split-target">Keep scrolling to test onEnterBack and scrub completion.</p>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
    <script src="animation.js"></script>
    <script src="../playground-v2.js"></script>
    <script>
      SplitTextPlaygroundV2.attach({
        init: setupAnimation,
        defaults: DEFAULT_CONFIG,
        storageKey: "playground-v2-tuner",
        targets: ".split-target",
      });
    </script>
  </body>
</html>
