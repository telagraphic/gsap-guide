<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HeureBleue Scroll Animation | Codegrid</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="gallery-viewport" data-gallery-id="1">
      <div class="gallery-grid">
        <div class="gallery-col gallery-col--side">
          <div class="gallery-tile"><img src="./assets/img1.jpg" alt="" /></div>
          <div class="gallery-tile"><img src="./assets/img2.jpg" alt="" /></div>
          <div class="gallery-tile"><img src="./assets/img3.jpg" alt="" /></div>
        </div>

        <div class="gallery-col gallery-col--side">
          <div class="gallery-tile"><img src="./assets/img4.jpg" alt="" /></div>
          <div class="gallery-tile"><img src="./assets/img5.jpg" alt="" /></div>
          <div class="gallery-tile"><img src="./assets/img6.jpg" alt="" /></div>
        </div>

        <div class="gallery-col gallery-col--main">
          <div class="gallery-tile"><img src="./assets/img7.jpg" alt="" /></div>
          <div class="gallery-tile gallery-tile--hero">
            <img src="./assets/img8.jpg" alt="" />
          </div>
          <div class="gallery-tile"><img src="./assets/img9.jpg" alt="" /></div>
        </div>

        <div class="gallery-col gallery-col--side">
          <div class="gallery-tile">
            <img src="./assets/img10.jpg" alt="" />
          </div>
          <div class="gallery-tile">
            <img src="./assets/img11.jpg" alt="" />
          </div>
          <div class="gallery-tile">
            <img src="./assets/img12.jpg" alt="" />
          </div>
        </div>

        <div class="gallery-col gallery-col--side">
          <div class="gallery-tile"><img src="./assets/img1.jpg" alt="" /></div>
          <div class="gallery-tile"><img src="./assets/img2.jpg" alt="" /></div>
          <div class="gallery-tile"><img src="./assets/img3.jpg" alt="" /></div>
        </div>
      </div>
    </section>

    <section class="gallery-viewport" data-gallery-id="2">
      <div class="gallery-grid">
        <div class="gallery-col gallery-col--side">
          <div class="gallery-tile"><img src="./assets/img1.jpg" alt="" /></div>
          <div class="gallery-tile"><img src="./assets/img2.jpg" alt="" /></div>
          <div class="gallery-tile"><img src="./assets/img3.jpg" alt="" /></div>
        </div>

        <div class="gallery-col gallery-col--side">
          <div class="gallery-tile"><img src="./assets/img4.jpg" alt="" /></div>
          <div class="gallery-tile"><img src="./assets/img5.jpg" alt="" /></div>
          <div class="gallery-tile"><img src="./assets/img6.jpg" alt="" /></div>
        </div>

        <div class="gallery-col gallery-col--main">
          <div class="gallery-tile"><img src="./assets/img7.jpg" alt="" /></div>
          <div class="gallery-tile gallery-tile--hero">
            <img src="./assets/img8.jpg" alt="" />
          </div>
          <div class="gallery-tile"><img src="./assets/img9.jpg" alt="" /></div>
        </div>

        <div class="gallery-col gallery-col--side">
          <div class="gallery-tile">
            <img src="./assets/img10.jpg" alt="" />
          </div>
          <div class="gallery-tile">
            <img src="./assets/img11.jpg" alt="" />
          </div>
          <div class="gallery-tile">
            <img src="./assets/img12.jpg" alt="" />
          </div>
        </div>

        <div class="gallery-col gallery-col--side">
          <div class="gallery-tile"><img src="./assets/img1.jpg" alt="" /></div>
          <div class="gallery-tile"><img src="./assets/img2.jpg" alt="" /></div>
          <div class="gallery-tile"><img src="./assets/img3.jpg" alt="" /></div>
        </div>
      </div>
    </section>

    <div class="container">
      <section class="hero">
        <div class="hero-img">
          <img src="./assets/hero.jpg" alt="" />
        </div>
        <div class="header">
          <h1>serene</h1>
          <h1>drift</h1>
        </div>
      </section>

      <section class="intro">
        <div class="tagline">
          <p>Inspired visuals for creators of calm and beauty</p>
        </div>
        <div class="divider"></div>
        <div class="intro-header">
          <h1>elevating</h1>
          <h1>serenity</h1>
        </div>
      </section>

      <section
        class="gallery-scroll-track"
        data-gallery-id="1"
        aria-label="Scroll-driven gallery motion"
      ></section>

      <section class="outro">
        <h1>crafted calm</h1>
        <h1>and beauty</h1>
      </section>

      <section
        class="gallery-scroll-track"
        data-gallery-id="2"
        aria-label="Scroll-driven gallery motion (chapter 2)"
      ></section>

      <section class="footer">
        <div class="footer-bg">
          <img src="./assets/footer.jpg" alt="" />
        </div>
      </section>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="https://unpkg.com/lenis@1.1.18/dist/lenis.min.js"></script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
