<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Tuner — sample playground</title>
    <link rel="stylesheet" href="../../fonts.css" />
    <link rel="stylesheet" href="../../styles/canvas-typography.css" />
    <link rel="stylesheet" href="styles.css" />
    <!-- Text Tuner panel styles (Phase 4) -->
    <link rel="stylesheet" href="../../styles/text-tuner.css" />
  </head>
  <body>
    <main class="page text-tuner-canvas">
      <header class="frame" aria-label="Scroll spacer" data-playground-trigger="header">
        <div class="frame__content">
          <p class="frame__copy" data-playground="header">SplitText Tuner.</p>
        </div>
      </header>

      <section
        class="frame"
        data-playground-trigger="section-1"
        aria-label="section one"
      >
        <div class="frame__content">
          <p class="frame__copy split-target" data-playground="section-1">
            &#8984;K to open the control panel. 
          </p>
        </div>
      </section>

      <section
        class="frame"
        data-playground-trigger="section-2"
        aria-label="section 2"
      >
        <div class="frame__content">
          <p class="frame__copy split-target" data-playground="section-2">
            Easily compare font settings, styles, splits, masks and more.
            More kern, less burn.
          </p>
        </div>
      </section>

      <section
        class="frame"
        data-playground-trigger="section-3"
        aria-label="section three"
      >
        <div class="frame__content">
          <p class="frame__copy split-target" data-playground="section-3">
            Tune ScrollTrigger settings for perfect timing, stagger and ease.
          </p>
        </div>
      </section>

      <section
        class="frame"
        data-playground-trigger="section-4"
        aria-label="section four"
      >
        <div class="frame__content">
          <p class="frame__copy split-target" data-playground="section-4">
            Adjust tween properties to get it tight and right.
          </p>
        </div>
      </section>

      <footer class="frame" aria-label="Non-playground footer" data-playground-trigger="footer">
        <div class="frame__content">
          <p class="frame__copy" data-playground="footer">
            Copy &amp; paste GSAP code and CSS tokens.
          </p>
        </div>
      </footer>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>

    <!-- Panel + registry ship from text-tuner src (Phase 3) -->
    <script type="module" src="script.js"></script>
  </body>
</html>
