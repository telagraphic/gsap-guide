<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GSAP SplitText Basics</title>
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="frame frame--1" aria-label="Frame 1">
        <h1 class="frame__headline" data-split>Character Reveal Text</h1>
      </section>
      <section class="frame frame--2" aria-label="Frame 2">
        <h1 class="frame__headline" data-split>Word stagger mask reveal text animation</h1>
      </section>
      <section class="frame frame--3" aria-label="Frame 3">
        <h1 class="frame__headline" data-split>Word stagger by stagger by filter</h1>
      </section>
      <section class="frame frame--4" aria-label="Frame 4">
        <h1 class="frame__headline" data-split>Target Every Character and Word in this Paragraph</h1>
      </section>
      <section class="frame frame--5" aria-label="Frame 5">
        <h1 class="frame__headline" data-split>Animate the line stagger and reveal</h1>
      </section>
      <section class="frame frame--6" aria-label="Frame 6">
        <h1 class="frame__headline" data-split>Apply a mask to the line and reveal</h1>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
    <script src="script.js" defer></script>
  </body>
</html>
